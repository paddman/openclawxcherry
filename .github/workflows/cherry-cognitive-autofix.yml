name: Cherry Cognitive Autofix

on:
  push:
    branches:
      - feature/cherry-cognitive-2026-v2
    paths:
      - "extensions/cherry-cognitive/scripts/apply-lint-fixes.mjs"
      - "extensions/cherry-cognitive/src/**"
      - ".github/workflows/cherry-cognitive-autofix.yml"

permissions:
  contents: write

concurrency:
  group: cherry-cognitive-autofix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cherry-cognitive-2026-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic migration
        run: node extensions/cherry-cognitive/scripts/apply-lint-fixes.mjs

      - name: Format migrated files
        run: pnpm exec oxfmt --write extensions/cherry-cognitive/src extensions/cherry-cognitive/scripts

      - name: Commit migration output
        shell: bash
        run: |
          if git diff --quiet -- extensions/cherry-cognitive/src extensions/cherry-cognitive/scripts; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/cherry-cognitive/src extensions/cherry-cognitive/scripts
          git commit -m "fix(cherry-cognitive): satisfy lint and type safety rules"
          git push origin HEAD:feature/cherry-cognitive-2026-v2
