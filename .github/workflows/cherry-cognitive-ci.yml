name: Cherry Cognitive CI

on:
  pull_request:
    paths:
      - "extensions/cherry-cognitive/**"
      - ".github/workflows/cherry-cognitive-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cherry-cognitive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feature/cherry-cognitive-2026-v2')
    name: Format, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cherry-cognitive-2026-v2
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply deterministic lint and type migration
        run: node extensions/cherry-cognitive/scripts/apply-lint-fixes.mjs

      - name: Format extension
        run: pnpm exec oxfmt --write extensions/cherry-cognitive

      - name: Commit migration output
        shell: bash
        run: |
          if git diff --quiet -- extensions/cherry-cognitive; then
            echo "No source migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/cherry-cognitive
          git commit -m "fix(cherry-cognitive): satisfy lint and type safety rules"
          git push origin HEAD:feature/cherry-cognitive-2026-v2

      - name: Lint extension
        shell: bash
        run: |
          set -o pipefail
          pnpm exec oxlint --tsconfig config/tsconfig/oxlint.extensions.json extensions/cherry-cognitive 2>&1 | tee /tmp/cherry-lint.log

      - name: Run Cherry Cognitive unit tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test \
            extensions/cherry-cognitive/src/runtime.test.ts \
            extensions/cherry-cognitive/src/policy.test.ts \
            extensions/cherry-cognitive/src/ingestion.test.ts \
            extensions/cherry-cognitive/src/autonomy.test.ts \
            extensions/cherry-cognitive/src/consolidation.test.ts \
            extensions/cherry-cognitive/src/learning.test.ts \
            extensions/cherry-cognitive/src/prediction.test.ts \
            extensions/cherry-cognitive/src/attention-schema.test.ts \
            extensions/cherry-cognitive/src/telemetry.test.ts \
            2>&1 | tee /tmp/cherry-tests.log

      - name: Verify lockfile is committed
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cherry-cognitive-validation
          path: |
            extensions/cherry-cognitive
            pnpm-lock.yaml
            /tmp/cherry-lint.log
            /tmp/cherry-tests.log
          if-no-files-found: warn
          retention-days: 3
