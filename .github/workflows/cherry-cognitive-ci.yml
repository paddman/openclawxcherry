name: Cherry Cognitive CI

on:
  pull_request:
    paths:
      - "extensions/cherry-cognitive/**"
      - ".github/workflows/cherry-cognitive-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cherry-cognitive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format extension in validation workspace
        run: pnpm exec oxfmt --write extensions/cherry-cognitive

      - name: Lint extension
        run: pnpm exec oxlint --tsconfig config/tsconfig/oxlint.extensions.json extensions/cherry-cognitive

      - name: Run Cherry Cognitive unit tests
        run: >-
          pnpm test
          extensions/cherry-cognitive/src/runtime.test.ts
          extensions/cherry-cognitive/src/policy.test.ts
          extensions/cherry-cognitive/src/ingestion.test.ts
          extensions/cherry-cognitive/src/autonomy.test.ts
          extensions/cherry-cognitive/src/consolidation.test.ts
          extensions/cherry-cognitive/src/learning.test.ts
          extensions/cherry-cognitive/src/prediction.test.ts
          extensions/cherry-cognitive/src/attention-schema.test.ts
          extensions/cherry-cognitive/src/telemetry.test.ts

      - name: Detect formatting drift
        id: format-drift
        continue-on-error: true
        run: git diff --exit-code -- extensions/cherry-cognitive

      - name: Upload formatted extension
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cherry-cognitive-formatted
          path: extensions/cherry-cognitive
          if-no-files-found: error
          retention-days: 3

      - name: Fail on formatting drift
        if: steps.format-drift.outcome == 'failure'
        run: |
          echo "Cherry Cognitive files require formatting. Download the cherry-cognitive-formatted artifact."
          exit 1
