name: Cherry Cognitive CI

on:
  pull_request:
    paths:
      - "extensions/cherry-cognitive/**"
      - ".github/workflows/cherry-cognitive-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cherry-cognitive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format extension in validation workspace
        run: pnpm exec oxfmt --write extensions/cherry-cognitive

      - name: Lint extension
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec oxlint --tsconfig config/tsconfig/oxlint.extensions.json extensions/cherry-cognitive 2>&1 | tee /tmp/cherry-lint.log

      - name: Run Cherry Cognitive unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test \
            extensions/cherry-cognitive/src/runtime.test.ts \
            extensions/cherry-cognitive/src/policy.test.ts \
            extensions/cherry-cognitive/src/ingestion.test.ts \
            extensions/cherry-cognitive/src/autonomy.test.ts \
            extensions/cherry-cognitive/src/consolidation.test.ts \
            extensions/cherry-cognitive/src/learning.test.ts \
            extensions/cherry-cognitive/src/prediction.test.ts \
            extensions/cherry-cognitive/src/attention-schema.test.ts \
            extensions/cherry-cognitive/src/telemetry.test.ts \
            2>&1 | tee /tmp/cherry-tests.log

      - name: Detect formatting drift
        id: format-drift
        continue-on-error: true
        run: git diff --exit-code -- extensions/cherry-cognitive

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cherry-cognitive-validation
          path: |
            extensions/cherry-cognitive
            /tmp/cherry-lint.log
            /tmp/cherry-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Report validation result
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          FORMAT_OUTCOME: ${{ steps['format-drift'].outcome }}
        run: |
          echo "lint=$LINT_OUTCOME tests=$TEST_OUTCOME format=$FORMAT_OUTCOME"
          if [[ "$LINT_OUTCOME" != "success" || "$TEST_OUTCOME" != "success" || "$FORMAT_OUTCOME" != "success" ]]; then
            echo "Cherry Cognitive validation failed. Download the cherry-cognitive-validation artifact for diagnostics."
            exit 1
          fi
