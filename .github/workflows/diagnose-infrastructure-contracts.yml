name: Diagnose infrastructure contracts

on:
  push:
    branches:
      - feature/proxmox-integration
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/proxmox-integration
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: 'false'
          node-version: '24.x'
          install-deps: 'true'
          frozen-lockfile: 'true'
          use-actions-cache: 'true'
          save-actions-cache: 'false'

      - name: Run plugin-a contract diagnostics
        shell: bash
        run: |
          set +e
          include_file=/tmp/plugin-a-include.json
          INCLUDE_FILE="$include_file" node --input-type=module <<'EOF'
          import { writeFileSync } from "node:fs";
          import { createPluginContractTestShards } from "./scripts/lib/plugin-contract-test-plan.mjs";

          const shard = createPluginContractTestShards().find(
            (entry) => entry.checkName === "checks-fast-contracts-plugins-a",
          );
          if (!shard) throw new Error("plugins-a shard not found");
          writeFileSync(process.env.INCLUDE_FILE, JSON.stringify(shard.includePatterns), "utf8");
          console.log(JSON.stringify(shard, null, 2));
          EOF
          OPENCLAW_VITEST_INCLUDE_FILE="$include_file" pnpm test:contracts:plugins > /tmp/contract-output.txt 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo
            cat "$include_file"
            echo
            tail -n 1600 /tmp/contract-output.txt
          } > .github/contract-diagnostic.txt
          exit 0

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/contract-diagnostic.txt
          git commit -m 'ci: capture infrastructure contract diagnostics'
          git push origin HEAD:feature/proxmox-integration
